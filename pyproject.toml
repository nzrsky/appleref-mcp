[project]
name = "appleref-mcp"
version = "0.2.0"
description = "Offline MCP server for Apple Developer Documentation, reading directly from a Dash-format Apple_API_Reference.docset"
authors = [
    { name = "Alexey Nazarov", email = "nazarov@ptr.vc" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "Brotli>=1.1.0",
]

[project.scripts]
appleref-mcp = "appleref_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
